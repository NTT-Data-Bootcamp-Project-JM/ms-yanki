openapi: 3.0.3
info:
  title: Yanki
  version: 1.0.0
  description: >
    Source of the Yanki API. The server interface is generated from this file.
    Mobile wallet, top-up, cash-out, and transfers between phone numbers.
paths:
  /api/v1/wallets:
    post:
      tags: [Wallet]
      operationId: create
      summary: Create a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRequest"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [Wallet]
      operationId: all
      summary: List wallets
      responses:
        "200":
          description: All wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/wallets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Wallet]
      operationId: one
      summary: Read one wallet
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    put:
      tags: [Wallet]
      operationId: update
      summary: Replace email and device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [Wallet]
      operationId: delete
      summary: Delete a wallet
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/wallets/transfers:
    post:
      tags: [Wallet]
      operationId: transfer
      summary: Transfer between phone numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Sender wallet after the transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/wallets/{id}/debit-card:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Wallet]
      operationId: link
      summary: Link a debit card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "200":
          description: Linked wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/wallets/{id}/top-ups:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Wallet]
      operationId: topUp
      summary: Request a top-up from the linked account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "202":
          description: Accepted. The wallet is credited only after the bank applies the debit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/wallets/{id}/cash-outs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Wallet]
      operationId: cashOut
      summary: Request a cash-out to the linked account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "202":
          description: Accepted. The wallet is debited immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: A valid bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: A business rule rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    WalletRequest:
      type: object
      required: [documentType, documentNumber, phone, imei, email]
      properties:
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT]
        documentNumber:
          type: string
        phone:
          type: string
        imei:
          type: string
        email:
          type: string
    UpdateRequest:
      type: object
      properties:
        email:
          type: string
        imei:
          type: string
    TransferRequest:
      type: object
      required: [sourcePhone, targetPhone, amount]
      properties:
        sourcePhone:
          type: string
        targetPhone:
          type: string
        amount:
          type: number
    LinkRequest:
      type: object
      required: [debitCardNumber]
      properties:
        debitCardNumber:
          type: string
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
    OperationAccepted:
      type: object
      required: [operationId]
      properties:
        operationId:
          type: string
    Wallet:
      type: object
      properties:
        id:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
        phone:
          type: string
        imei:
          type: string
        email:
          type: string
        balance:
          type: number
        debitCardNumber:
          type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
security:
  - bearer-jwt: []
